<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NordDiv</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--tg-theme-bg-color, #fff);
      color: var(--tg-theme-text-color, #000);
      padding: 16px;
      padding-bottom: 80px;
    }
    h2 {
      font-size: 18px;
      margin-bottom: 16px;
      color: var(--tg-theme-section-header-text-color, #168acd);
    }
    .company-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid var(--tg-theme-section-separator-color, #e7e7e7);
    }
    .company-name {
      font-size: 15px;
      flex: 1;
      padding-right: 12px;
    }
    .shares-input {
      width: 90px;
      padding: 6px 10px;
      border: 1px solid var(--tg-theme-hint-color, #ccc);
      border-radius: 8px;
      font-size: 15px;
      background: var(--tg-theme-secondary-bg-color, #f1f1f1);
      color: var(--tg-theme-text-color, #000);
      text-align: right;
    }
    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--tg-theme-hint-color, #999);
    }
    .empty-state h3 { font-size: 17px; margin-bottom: 8px; color: var(--tg-theme-text-color, #000); }
    .save-btn {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      padding: 14px 20px;
      background: var(--tg-theme-button-color, #40a7e3);
      color: var(--tg-theme-button-text-color, #fff);
      font-size: 16px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .save-btn:active { opacity: 0.85; }
  </style>
</head>
<body>
  <div id="app"></div>
  <button class="save-btn" onclick="saveHoldings()">&#10003; Save Holdings</button>

  <script>
    // BUG FIX: use window.location.search so the #tgWebAppData fragment is excluded
    const params = new URLSearchParams(window.location.search);
    const country = params.get("country") || "fi";
    // getAll('c') gives a clean array — no fragment contamination
    const companies = params.getAll("c");

    const app = document.getElementById("app");

    if (companies.length === 0) {
      app.innerHTML = `
        <div class="empty-state">
          <h3>No companies to add</h3>
          <p>All companies for this country are already in your holdings.</p>
        </div>`;
    } else {
      let html = `<h2>Enter your share counts</h2>`;
      companies.forEach((name, i) => {
        html += `
          <div class="company-row">
            <span class="company-name">${escapeHtml(name)}</span>
            <input
              class="shares-input"
              type="number"
              min="0"
              step="1"
              placeholder="0"
              id="shares_${i}"
              inputmode="decimal"
            />
          </div>`;
      });
      app.innerHTML = html;
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function saveHoldings() {
      const holdings = companies.map((name, i) => {
        const input = document.getElementById("shares_" + i);
        const shares = input ? parseFloat(input.value) || 0 : 0;
        return { company: name, shares };
      });

      const payload = JSON.stringify({ country, holdings });

      if (window.Telegram && Telegram.WebApp) {
        Telegram.WebApp.sendData(payload);
        Telegram.WebApp.close();
      } else {
        // Fallback for browser testing
        alert("Would send: " + payload);
      }
    }

    // Let Telegram know the app is ready
    if (window.Telegram && Telegram.WebApp) {
      Telegram.WebApp.ready();
      Telegram.WebApp.expand();
    }
  </script>
</body>
</html>
