<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>NordDiv – Add Holdings</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --tg-bg: var(--tg-theme-bg-color, #ffffff);
    --tg-surface: var(--tg-theme-secondary-bg-color, #f2f2f7);
    --tg-text: var(--tg-theme-text-color, #000000);
    --tg-hint: var(--tg-theme-hint-color, #8e8e93);
    --tg-link: var(--tg-theme-link-color, #007aff);
    --tg-button: var(--tg-theme-button-color, #007aff);
    --tg-button-text: var(--tg-theme-button-text-color, #ffffff);
    --radius: 12px;
    --radius-sm: 8px;
    --space: 16px;
  }

  html, body {
    height: 100%;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 16px;
    background: var(--tg-bg);
    color: var(--tg-text);
    -webkit-font-smoothing: antialiased;
  }

  body {
    display: flex;
    flex-direction: column;
    min-height: 100dvh;
    padding-bottom: env(safe-area-inset-bottom);
  }

  header {
    padding: 20px var(--space) 12px;
    border-bottom: 1px solid oklch(from var(--tg-text, #000) l c h / 0.08);
  }

  header h1 {
    font-size: 17px;
    font-weight: 600;
    letter-spacing: -0.2px;
  }

  header p {
    font-size: 13px;
    color: var(--tg-hint);
    margin-top: 3px;
  }

  main {
    flex: 1;
    overflow-y: auto;
    padding: 12px var(--space) 100px;
  }

  .group-label {
    font-size: 12px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    color: var(--tg-hint);
    padding: 16px 4px 6px;
  }

  .company-card {
    display: flex;
    align-items: center;
    background: var(--tg-surface);
    border-radius: var(--radius);
    padding: 12px var(--space);
    margin-bottom: 2px;
    gap: 12px;
    transition: opacity 0.15s;
  }

  .company-card:first-of-type { border-radius: var(--radius) var(--radius) var(--radius-sm) var(--radius-sm); }
  .company-card:last-of-type  { border-radius: var(--radius-sm) var(--radius-sm) var(--radius) var(--radius); margin-bottom: 0; }
  .company-card:only-of-type  { border-radius: var(--radius); }

  .company-info {
    flex: 1;
    min-width: 0;
  }

  .company-name {
    font-size: 15px;
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .company-div {
    font-size: 12px;
    color: var(--tg-hint);
    margin-top: 1px;
  }

  .share-input-wrap {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
  }

  .share-input {
    width: 80px;
    height: 36px;
    border: 1.5px solid oklch(from var(--tg-text, #000) l c h / 0.15);
    border-radius: var(--radius-sm);
    background: var(--tg-bg);
    color: var(--tg-text);
    font-size: 15px;
    font-weight: 500;
    font-family: inherit;
    text-align: right;
    padding: 0 10px;
    outline: none;
    transition: border-color 0.15s;
    -webkit-appearance: none;
    appearance: none;
  }

  .share-input:focus {
    border-color: var(--tg-button);
  }

  .share-input::placeholder { color: var(--tg-hint); font-weight: 400; }

  .share-label {
    font-size: 13px;
    color: var(--tg-hint);
    white-space: nowrap;
  }

  .footer {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    padding: 12px var(--space);
    padding-bottom: calc(12px + env(safe-area-inset-bottom));
    background: var(--tg-bg);
    border-top: 1px solid oklch(from var(--tg-text, #000) l c h / 0.08);
  }

  .btn-save {
    width: 100%;
    height: 50px;
    background: var(--tg-button);
    color: var(--tg-button-text);
    border: none;
    border-radius: var(--radius);
    font-size: 16px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    transition: opacity 0.15s, transform 0.1s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    letter-spacing: -0.1px;
  }

  .btn-save:active { opacity: 0.85; transform: scale(0.99); }
  .btn-save:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

  .empty-state {
    text-align: center;
    padding: 60px 24px;
    color: var(--tg-hint);
  }
  .empty-state svg { margin: 0 auto 16px; opacity: 0.4; }
  .empty-state h2 { font-size: 17px; font-weight: 600; color: var(--tg-text); margin-bottom: 8px; }
  .empty-state p  { font-size: 14px; line-height: 1.5; }

  .toast {
    position: fixed;
    top: 16px;
    left: 50%;
    transform: translateX(-50%) translateY(-80px);
    background: #1c1c1e;
    color: #fff;
    padding: 10px 18px;
    border-radius: 20px;
    font-size: 14px;
    font-weight: 500;
    white-space: nowrap;
    transition: transform 0.3s cubic-bezier(0.16,1,0.3,1);
    z-index: 100;
    pointer-events: none;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<header>
  <h1>📊 Add Holdings</h1>
  <p id="header-sub">Enter your share counts below</p>
</header>

<main id="main-content">
  <div class="empty-state" id="empty-state" style="display:none">
    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
      <path d="M9 17H7A5 5 0 0 1 7 7h2"/><path d="M15 7h2a5 5 0 1 1 0 10h-2"/><line x1="8" y1="12" x2="16" y2="12"/>
    </svg>
    <h2>No companies to add</h2>
    <p>All companies for this country are already in your holdings.</p>
  </div>
  <div id="companies-list"></div>
</main>

<div class="footer">
  <button class="btn-save" id="btn-save" onclick="saveHoldings()">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
      <polyline points="20 6 9 17 4 12"/>
    </svg>
    Save Holdings
  </button>
</div>

<div class="toast" id="toast"></div>

<script>
const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();

// ── Parse companies from URL params ──────────────────────────────────────────
const params   = new URLSearchParams(window.location.search);
const raw      = params.get("companies") || "";
const country  = params.get("country")   || "";
const flag     = params.get("flag")      || "";

const companies = raw ? raw.split("|").map(s => {
  const [name, amount] = s.split(":::");
  return { name: decodeURIComponent(name), amount: amount ? decodeURIComponent(amount) : null };
}) : [];

// ── Render ────────────────────────────────────────────────────────────────────
const list    = document.getElementById("companies-list");
const sub     = document.getElementById("header-sub");
const empty   = document.getElementById("empty-state");

if (flag) document.querySelector("h1").textContent = flag + " Add Holdings";

if (companies.length === 0) {
  empty.style.display = "block";
  document.getElementById("btn-save").disabled = true;
} else {
  sub.textContent = companies.length + " " + (companies.length === 1 ? "company" : "companies") + " · enter share counts";

  const label = document.createElement("div");
  label.className = "group-label";
  label.textContent = (flag || country || "").toUpperCase() + " Companies paying dividends this month";
  list.appendChild(label);

  companies.forEach((c, i) => {
    const isFirst = i === 0;
    const isLast  = i === companies.length - 1;

    const card = document.createElement("div");
    card.className = "company-card";
    if (isFirst && isLast) card.style.borderRadius = "12px";
    else if (isFirst)      card.style.borderRadius = "12px 12px 8px 8px";
    else if (isLast)       card.style.borderRadius = "8px 8px 12px 12px";
    else                   card.style.borderRadius = "8px";

    card.innerHTML = \`
      <div class="company-info">
        <div class="company-name">\${c.name}</div>
        \${c.amount ? \`<div class="company-div">\${c.amount} per share</div>\` : ""}
      </div>
      <div class="share-input-wrap">
        <input
          class="share-input"
          type="number"
          inputmode="numeric"
          min="0"
          step="1"
          placeholder="0"
          id="input-\${i}"
          data-company="\${c.name}"
          aria-label="Shares of \${c.name}"
        >
        <span class="share-label">shares</span>
      </div>
    \`;
    list.appendChild(card);
  });

  // Focus first input after a short delay
  setTimeout(() => {
    const first = document.querySelector(".share-input");
    if (first) first.focus();
  }, 300);

  // Enter key moves to next input or submits
  document.addEventListener("keydown", e => {
    if (e.key !== "Enter") return;
    const inputs = [...document.querySelectorAll(".share-input")];
    const idx    = inputs.indexOf(document.activeElement);
    if (idx >= 0 && idx < inputs.length - 1) {
      inputs[idx + 1].focus();
      inputs[idx + 1].select();
    } else {
      saveHoldings();
    }
  });
}

// ── Save ──────────────────────────────────────────────────────────────────────
function saveHoldings() {
  const btn = document.getElementById("btn-save");
  const inputs = [...document.querySelectorAll(".share-input")];

  const holdings = {};
  let hasAny = false;

  for (const inp of inputs) {
    const val = parseFloat(inp.value);
    if (!isNaN(val) && val > 0) {
      holdings[inp.dataset.company] = val;
      hasAny = true;
    }
  }

  if (!hasAny) {
    showToast("Enter at least one share count");
    const first = inputs.find(i => !i.value || parseFloat(i.value) <= 0);
    if (first) first.focus();
    return;
  }

  btn.disabled = true;
  btn.innerHTML = \`
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
      <polyline points="20 6 9 17 4 12"/>
    </svg>
    Saved!\`;

  const payload = JSON.stringify({ holdings, country });
  tg.sendData(payload);
}

// ── Toast ─────────────────────────────────────────────────────────────────────
function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 2200);
}
</script>
</body>
</html>
